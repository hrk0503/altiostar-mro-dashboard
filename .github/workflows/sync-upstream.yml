name: Sync staging from LifeAtlas upstream

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard main (preserve workflow)
        uses: actions/checkout@v4
        with:
          ref: main
          path: dashboard

      - name: Clone and sync upstream
        env:
          PAT: ${{ secrets.UPSTREAM_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Clone LifeAtlas staging
          git clone --branch staging --single-branch \
            https://x-access-token:${PAT}@github.com/LifeAtlas/altiostar-tokyo-mro.git \
            upstream

          cd upstream

          # Remove upstream .github (PAT lacks workflow scope)
          rm -rf .github

          # Copy our workflow back in
          cp -r ../dashboard/.github .

          # Lightweight requirements for Streamlit Cloud
          cat > requirements.txt << 'REQS'
          streamlit
          plotly
          pandas
          numpy
          pyyaml
          pydantic
          REQS

          git config user.name "Harshit Rana"
          git config user.email "ranaharshit0503@gmail.com"
          git add -A
          git commit -m "sync: LifeAtlas staging with dashboard requirements" || true

          # Push to both branches
          git remote add dashboard \
            https://x-access-token:${GH_TOKEN}@github.com/hrk0503/altiostar-mro-dashboard.git
          git push dashboard staging --force
          git push dashboard HEAD:main --force

          echo "Synced to both main and staging"
