[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altiostar-mro-pipeline"
version = "0.1.0"
description = "Reusable MRO Training Pipeline — CSV in, trained RL model + dashboard out"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "mlflow>=2.12",
    "streamlit>=1.35",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
