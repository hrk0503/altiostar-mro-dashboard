[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altiostar-mro-pipeline"
version = "0.1.0"
description = "Reusable MRO Training Pipeline — CSV in, trained RL model + dashboard out"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "gymnasium==1.1.1",
    "stable-baselines3==2.7.1",
    "pydantic==2.13.4",
    "pandas==2.3.3",
    "pyarrow==20.0.0",
    "mlflow==3.1.4",
    "streamlit==1.50.0",
    "pyyaml==6.0.3",
    "numpy==2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==6.2.1",
    "hypothesis==6.141.1",
    "mypy==1.16.0",
    "ruff==0.11.13",
    "pre-commit==4.2.0",
]
export = [
    "onnx==1.18.0",
    "onnxruntime==1.22.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
