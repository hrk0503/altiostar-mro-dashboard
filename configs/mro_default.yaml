# MRO Environment Config — Default (75-cell Shibuya cluster)
# Same engine, different use case = different YAML

environment:
  n_cells: 75
  n_obs_features: 10  # RSRP, RSRQ, SINR, PRB util, HO attempts/success/fail/ping-pong, UE count, throughput
  n_actions: 4         # tilt_delta, power_delta, cio_adjust, neighbor_toggle

observation:
  features:
    - rsrp_mean
    - rsrq_mean
    - sinr_mean
    - prb_utilization
    - ho_attempts
    - ho_successes
    - ho_failures
    - ho_ping_pongs
    - connected_ues
    - throughput_dl_mbps

action:
  tilt_range: [-2.0, 2.0]       # degrees
  power_range: [-3.0, 3.0]      # dBm
  cio_range: [-6.0, 6.0]        # dB (subset of 3GPP -24/+24)
  cio_step: 0.5                  # dB

reward:
  version: v0
  ho_success: 1.0
  ho_failure: -5.0
  ping_pong: -2.0

training:
  algorithm: PPO
  total_timesteps: 100000
  seed: 42
  n_eval_episodes: 100
  log_interval: 10

data:
  site_database: data/synthetic/site_database.csv
  neighbor_relations: data/synthetic/neighbor_relations.csv
  pm_data: data/synthetic/pm_data_april2026.csv
  cluster_summary: data/synthetic/cluster_kpi_summary.csv
